<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="1280" height="740" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="modalShadow" x="-5%" y="-5%" width="110%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.30" />
    </filter>
  </defs>
  
    <!-- Outer Window Container -->
    <g>
      <!-- Main Window Canvas Background -->
      <rect width="1280" height="740" fill="#dcdfe3" />

      <!-- ========================================== -->
      <!-- 1. MAIN WINDOW TITLE BAR (Target of Arrow 1) -->
      <!-- ========================================== -->
      <rect x="0" y="0" width="1280" height="32" fill="#22262c" />
      <line x1="0" y1="32" x2="1280" y2="32" stroke="#333b46" stroke-width="1" />

      <!-- App Icon -->
      <rect x="10" y="8" width="16" height="16" rx="3" fill="#205493" />
      <circle cx="18" cy="16" r="4" fill="#ffffff" />

      <!-- Title Text -->
      <text x="34" y="21" font-size="12" font-weight="600" fill="#f8fafc">Radio &amp; TV Segmenter v3.8.4-stable — Project: gun.violence.final.version.rtvs * - Radio &amp; TV Segmenter</text>

      <!-- Main Window Controls (Right) -->
      <g transform="translate(1170, 0)">
        <!-- Minimize -->
        <rect x="0" y="0" width="36" height="32" fill="transparent" />
        <line x1="13" y1="17" x2="23" y2="17" stroke="#f8fafc" stroke-width="1.2" />
        <!-- Maximize -->
        <rect x="36" y="0" width="36" height="32" fill="transparent" />
        <rect x="48" y="11" width="11" height="10" fill="none" stroke="#f8fafc" stroke-width="1.2" />
        <!-- Close -->
        <rect x="72" y="0" width="38" height="32" fill="transparent" />
        <line x1="84" y1="11" x2="96" y2="21" stroke="#f8fafc" stroke-width="1.2" />
        <line x1="96" y1="11" x2="84" y2="21" stroke="#f8fafc" stroke-width="1.2" />
      </g>

      <!-- Main Menu Bar -->
      <rect x="0" y="33" width="1280" height="28" fill="#e3e6ea" />
      <line x1="0" y1="61" x2="1280" y2="61" stroke="#b6bcc4" stroke-width="1" />
      <g transform="translate(14, 51)" font-size="12" font-weight="500" fill="#22262c">
        <text x="0" y="0">File</text>
        <text x="40" y="0">Edit</text>
        <text x="80" y="0">View</text>
        <text x="126" y="0">Tools</text>
        <text x="176" y="0">Settings</text>
        <text x="238" y="0">Help</text>
      </g>

      <!-- Main Action Toolbar -->
      <g transform="translate(10, 68)">
        <rect x="0" y="0" width="46" height="26" rx="4" fill="#d0d4d9" stroke="#b2b8c0" stroke-width="1" />
        <polygon points="18,7 18,19 28,13" fill="#22262c" />
        <text x="26" y="17" font-size="11" font-weight="600" fill="#22262c"></text>
        
        <text x="56" y="17" font-family="monospace" font-size="12" font-weight="600" fill="#22262c">00:00.000 / 00:00.000</text>
        <text x="205" y="17" font-size="11" fill="#545b66">Speaker detection loaded: 3 speaker(s).</text>

        <circle cx="1100" cy="13" r="3" fill="#6b7280" />
        <text x="1108" y="17" font-size="11" fill="#545b66">Unsaved changes</text>
        
        <rect x="1198" y="0" width="72" height="26" rx="4" fill="#d0d4d9" stroke="#b2b8c0" stroke-width="1" />
        <text x="1206" y="17" font-size="11" font-weight="600" fill="#22262c">Save Project</text>
      </g>

      <!-- Waveform & Timeline Viewport (Behind dialog) -->
      <g transform="translate(10, 100)">
        <rect x="0" y="0" width="1260" height="110" rx="4" fill="#eaedf0" stroke="#b6bcc4" stroke-width="1" />
        <rect x="0" y="0" width="1260" height="20" fill="#d6dae0" />
        <line x1="0" y1="20" x2="1260" y2="20" stroke="#b6bcc4" stroke-width="1" />
        
        <!-- Ruler time markers -->
        <g font-size="9" fill="#545b66" font-family="monospace">
          <text x="10" y="14">00:00</text><line x1="15" y1="16" x2="15" y2="20" stroke="#545b66" />
          <text x="160" y="14">01:00</text><line x1="175" y1="16" x2="175" y2="20" stroke="#545b66" />
          <text x="320" y="14">02:00</text><line x1="335" y1="16" x2="335" y2="20" stroke="#545b66" />
          <text x="480" y="14">03:00</text><line x1="495" y1="16" x2="495" y2="20" stroke="#545b66" />
          <text x="640" y="14">04:00</text><line x1="655" y1="16" x2="655" y2="20" stroke="#545b66" />
          <text x="800" y="14">05:00</text><line x1="815" y1="16" x2="815" y2="20" stroke="#545b66" />
          <text x="960" y="14">06:00</text><line x1="975" y1="16" x2="975" y2="20" stroke="#545b66" />
          <text x="1120" y="14">07:00</text><line x1="1135" y1="16" x2="1135" y2="20" stroke="#545b66" />
        </g>

        <!-- Audio label -->
        <text x="10" y="36" font-size="10" font-weight="700" fill="#9a3412">Audio: gun.violence.final.version.wav</text>

        <!-- Waveform shape -->
        <path d="M 10 65 Q 25 25, 40 65 T 70 65 T 100 20 T 130 65 T 160 30 T 190 65 T 220 25 T 250 65 T 280 40 T 310 65 T 340 50 T 370 65 T 400 65 T 430 65 T 460 65 T 490 65 T 520 65 T 550 65 T 580 65 T 610 65 T 640 65 T 670 65 T 700 65 T 730 65 T 760 65 T 790 65 T 820 65 T 850 65 T 880 65 T 910 65 T 940 65 T 970 25 T 1000 65 T 1030 35 T 1060 65 T 1090 20 T 1120 65 T 1150 25 T 1180 65 T 1210 30 T 1240 65 L 1240 65 L 10 65 Z" fill="#4178a8" fill-opacity="0.85" />
        <path d="M 10 65 Q 25 105, 40 65 T 70 65 T 100 110 T 130 65 T 160 100 T 190 65 T 220 105 T 250 65 T 280 90 T 310 65 T 340 80 T 370 65 T 400 65 T 430 65 T 460 65 T 490 65 T 520 65 T 550 65 T 580 65 T 610 65 T 640 65 T 670 65 T 700 65 T 730 65 T 760 65 T 790 65 T 820 65 T 850 65 T 880 65 T 910 65 T 940 65 T 970 105 T 1000 65 T 1030 95 T 1060 65 T 1090 110 T 1120 65 T 1150 105 T 1180 65 T 1210 100 T 1240 65 L 1240 65 L 10 65 Z" fill="#4178a8" fill-opacity="0.85" />

        <!-- Red Playhead Line -->
        <line x1="108" y1="20" x2="108" y2="108" stroke="#b91c1c" stroke-width="2" />
      </g>

      <!-- Background Lower Panels (Transcript on left, Story editor on right) -->
      <g transform="translate(10, 218)">
        <!-- Left transcript frame -->
        <rect x="0" y="0" width="760" height="510" rx="4" fill="#eaedf0" stroke="#b6bcc4" stroke-width="1" />
        <rect x="8" y="8" width="160" height="24" rx="3" fill="#eaedf0" stroke="#b6bcc4" stroke-width="1" />
        <text x="16" y="24" font-size="11" fill="#78808d">Find in transcript...</text>

        <!-- Transcript lines -->
        <g transform="translate(16, 54)" font-size="11">
          <text x="0" y="0" font-family="monospace" font-weight="700" fill="#22262c">00:00</text>
          <text x="40" y="0" font-weight="700" fill="#205493">Kevin Walker:</text>
          <text x="130" y="0" fill="#22262c">Eight years ago, Stanley Crawford lost his son to gun violence...</text>

          <text x="0" y="32" font-family="monospace" font-weight="700" fill="#22262c">00:20</text>
          <text x="40" y="32" font-weight="700" fill="#205493">Stanley Crawford:</text>
          <text x="156" y="32" fill="#22262c">I love my grandson. I don't want him to end up dead...</text>

          <text x="0" y="64" font-family="monospace" font-weight="700" fill="#22262c">00:34</text>
          <text x="40" y="64" fill="#22262c">You know, I wish we had a world where we didn't have to...</text>

          <text x="0" y="96" font-family="monospace" font-weight="700" fill="#22262c">00:38</text>
          <text x="40" y="96" font-weight="700" fill="#205493">Kevin Walker:</text>
          <text x="130" y="96" fill="#22262c">The gun violence epidemic in Philadelphia has prompted...</text>
        </g>

        <!-- Right story sidebar frame -->
        <g transform="translate(770, 0)">
          <rect x="0" y="0" width="480" height="510" rx="4" fill="#e3e6ea" stroke="#b6bcc4" stroke-width="1" />
          <rect x="12" y="12" width="456" height="28" rx="3" fill="#eaedf0" stroke="#b6bcc4" stroke-width="1" />
          <text x="20" y="30" font-size="11" fill="#78808d">Story headline / title</text>
          
          <!-- Activity History Card -->
          <g transform="translate(12, 380)">
            <rect x="0" y="0" width="456" height="110" rx="4" fill="#d0d4d9" stroke="#b2b8c0" stroke-width="1" />
            <text x="12" y="20" font-size="11" font-weight="700" fill="#22262c">Activity History &amp; Recovery</text>
            <rect x="8" y="30" width="440" height="32" rx="3" fill="#2e74b5" />
            <text x="16" y="50" font-family="monospace" font-size="10" fill="#ffffff">[08:24:33 PM] [SETTINGS] Preferences updated.</text>
          </g>
        </g>
      </g>

      <!-- ======================================================== -->
      <!-- 2. MODAL PREFERENCES DIALOG (Target of Arrow 2)           -->
      <!-- ======================================================== -->
      <g transform="translate(230, 95)" filter="url(#modalShadow)">
        <!-- Dialog Outer Frame -->
        <rect width="820" height="570" rx="8" fill="#dcdfe3" stroke="#9ea6b0" stroke-width="1.5" />

        <!-- Dialog Title Bar (Top of Preferences Modal) -->
        <path d="M 0 8 Q 0 0 8 0 L 812 0 Q 820 0 820 8 L 820 34 L 0 34 Z" fill="#22262c" />
        <line x1="0" y1="34" x2="820" y2="34" stroke="#333b46" stroke-width="1" />

        <!-- Dialog App Icon -->
        <rect x="12" y="9" width="16" height="16" rx="3" fill="#205493" />
        <circle cx="20" cy="17" r="4" fill="#ffffff" />

        <!-- Dialog Title Text -->
        <text x="36" y="22" font-size="12" font-weight="600" fill="#f8fafc">Preferences — Radio &amp; TV Segmenter</text>

        <!-- Dialog Controls (Right) -->
        <g transform="translate(715, 0)">
          <rect x="0" y="0" width="32" height="34" fill="transparent" />
          <line x1="11" y1="18" x2="21" y2="18" stroke="#f8fafc" stroke-width="1.2" />
          <rect x="32" y="0" width="32" height="34" fill="transparent" />
          <rect x="42" y="12" width="11" height="10" fill="none" stroke="#f8fafc" stroke-width="1.2" />
          <rect x="64" y="0" width="38" height="34" fill="transparent" />
          <line x1="76" y1="12" x2="88" y2="22" stroke="#f8fafc" stroke-width="1.2" />
          <line x1="88" y1="12" x2="76" y2="22" stroke="#f8fafc" stroke-width="1.2" />
        </g>

        <!-- Dialog Body: Left Sidebar (Categories) -->
        <g transform="translate(14, 46)">
          <rect width="146" height="510" rx="5" fill="#e3e6ea" stroke="#b6bcc4" stroke-width="1" />

          <!-- Category items -->
          <g transform="translate(6, 6)" font-size="11" font-weight="500">
            <!-- Active General tab -->
            <rect x="0" y="0" width="134" height="28" rx="4" fill="#2e74b5" />
            <text x="10" y="18" font-weight="700" fill="#ffffff">General</text>

            <text x="10" y="48" fill="#22262c">Keyboard Shortcuts</text>
            <text x="10" y="78" fill="#22262c">Audio Hardware</text>
            <text x="10" y="108" fill="#22262c">Updates &amp; GitHub</text>
            <text x="10" y="138" fill="#22262c">AI Models</text>
            <text x="10" y="168" fill="#22262c">GPU Acceleration</text>
            <text x="10" y="198" fill="#22262c">Playback &amp; Timeline</text>
            <text x="10" y="228" fill="#22262c">Detection</text>
            <text x="10" y="258" fill="#22262c">Batch Processing</text>
            <text x="10" y="288" fill="#22262c">Cleanup Data</text>
            <text x="10" y="318" fill="#22262c">WordPress</text>
            <text x="10" y="348" fill="#22262c">YouTube</text>
            <text x="10" y="378" fill="#22262c">Google Docs</text>

            <line x1="0" y1="400" x2="134" y2="400" stroke="#b6bcc4" stroke-width="1" />
            <rect x="0" y="410" width="134" height="26" rx="4" fill="#d0d4d9" stroke="#b2b8c0" stroke-width="1" />
            <text x="8" y="427" font-size="10" font-weight="600" fill="#22262c">Restore System Defaults...</text>
          </g>
        </g>

        <!-- Dialog Body: Right Content Form -->
        <g transform="translate(170, 46)">
          <rect width="636" height="510" rx="5" fill="#eaedf0" stroke="#b6bcc4" stroke-width="1" />

          <!-- Form Fields -->
          <g transform="translate(16, 26)" font-size="11">
            <!-- Theme Mode -->
            <text x="0" y="14" font-weight="500" fill="#22262c">Theme Mode:</text>
            <rect x="140" y="0" width="460" height="24" rx="4" fill="#eaedf0" stroke="#b6bcc4" stroke-width="1" />
            <text x="150" y="16" fill="#22262c">light</text>
            <polygon points="585,10 595,10 590,16" fill="#545b66" />

            <!-- UI Language -->
            <text x="0" y="46" font-weight="500" fill="#22262c">UI Language / Idioma:</text>
            <rect x="140" y="32" width="460" height="24" rx="4" fill="#eaedf0" stroke="#b6bcc4" stroke-width="1" />
            <text x="150" y="48" fill="#22262c">English</text>
            <polygon points="585,42 595,42 590,48" fill="#545b66" />

            <!-- Startup Project -->
            <text x="0" y="78" font-weight="500" fill="#22262c">Startup Project:</text>
            <rect x="140" y="64" width="460" height="24" rx="4" fill="#eaedf0" stroke="#b6bcc4" stroke-width="1" />
            <text x="150" y="80" fill="#22262c">Open last project</text>
            <polygon points="585,74 595,74 590,80" fill="#545b66" />

            <!-- Default Projects Folder -->
            <text x="0" y="110" font-weight="500" fill="#22262c">Default Projects Folder:</text>
            <rect x="140" y="96" width="390" height="24" rx="4" fill="#eaedf0" stroke="#b6bcc4" stroke-width="1" />
            <rect x="536" y="96" width="64" height="24" rx="4" fill="#d0d4d9" stroke="#b2b8c0" stroke-width="1" />
            <text x="548" y="112" font-size="10" font-weight="600" fill="#22262c">Browse...</text>

            <!-- Checkboxes -->
            <g transform="translate(140, 130)">
              <rect x="0" y="0" width="14" height="14" rx="2" fill="transparent" stroke="#78808d" stroke-width="1.2" />
              <text x="22" y="11" fill="#22262c">Save projects in the same folder as original media file</text>

              <rect x="0" y="24" width="14" height="14" rx="2" fill="#2e74b5" stroke="#2e74b5" stroke-width="1.2" />
              <polyline points="3,31 6,34 11,28" fill="none" stroke="#ffffff" stroke-width="1.8" />
              <text x="22" y="35" fill="#22262c">Create dedicated project bundle with subfolders for exports and media</text>
            </g>

            <!-- Media Ingest Mode -->
            <text x="0" y="200" font-weight="500" fill="#22262c">Media Ingest Mode:</text>
            <rect x="140" y="186" width="460" height="24" rx="4" fill="#eaedf0" stroke="#b6bcc4" stroke-width="1" />
            <text x="150" y="202" fill="#22262c">Reference in place (Save disk space / default)</text>
            <polygon points="585,196 595,196 590,202" fill="#545b66" />

            <!-- Instance Handling Mode -->
            <text x="0" y="232" font-weight="500" fill="#22262c">Instance Handling Mode:</text>
            <rect x="140" y="218" width="460" height="24" rx="4" fill="#eaedf0" stroke="#b6bcc4" stroke-width="1" />
            <text x="150" y="234" fill="#22262c">Open files in existing app instance (Single Instance)</text>
            <polygon points="585,228 595,228 590,234" fill="#545b66" />

            <!-- Checkboxes group -->
            <g transform="translate(0, 256)">
              <text x="0" y="11" fill="#22262c">Selection Popup:</text>
              <rect x="140" y="0" width="14" height="14" rx="2" fill="transparent" stroke="#78808d" stroke-width="1.2" />
              <text x="162" y="11" fill="#22262c">Show floating quick-action toolbar on text selection in transcript</text>

              <text x="0" y="32" fill="#22262c">Comments Sidebar:</text>
              <rect x="140" y="21" width="14" height="14" rx="2" fill="#2e74b5" stroke="#2e74b5" stroke-width="1.2" />
              <polyline points="143,28 146,31 151,25" fill="none" stroke="#ffffff" stroke-width="1.8" />
              <text x="162" y="32" fill="#22262c">Open Comments sidebar on startup</text>

              <text x="0" y="53" fill="#22262c">Transcript Highlights:</text>
              <rect x="140" y="42" width="14" height="14" rx="2" fill="#2e74b5" stroke="#2e74b5" stroke-width="1.2" />
              <polyline points="143,49 146,52 151,46" fill="none" stroke="#ffffff" stroke-width="1.8" />
              <text x="162" y="53" fill="#22262c">Show Comment highlights in transcript</text>

              <text x="0" y="74" fill="#22262c">Timestamps:</text>
              <rect x="140" y="63" width="14" height="14" rx="2" fill="#2e74b5" stroke="#2e74b5" stroke-width="1.2" />
              <polyline points="143,70 146,73 151,67" fill="none" stroke="#ffffff" stroke-width="1.8" />
              <text x="162" y="74" fill="#22262c">Show timestamps in transcript viewer</text>

              <text x="0" y="95" fill="#22262c">Timecode Precision:</text>
              <rect x="140" y="84" width="14" height="14" rx="2" fill="transparent" stroke="#78808d" stroke-width="1.2" />
              <text x="162" y="95" fill="#22262c">Show milliseconds in timestamps (MM:SS.mmm)</text>

              <text x="0" y="120" fill="#22262c">Auto-save Interval:</text>
              <rect x="140" y="106" width="320" height="24" rx="4" fill="#eaedf0" stroke="#b6bcc4" stroke-width="1" />
              <text x="150" y="122" fill="#22262c">5 min (0 = off)</text>
            </g>

            <!-- Bottom Buttons in form -->
            <g transform="translate(0, 420)">
              <rect x="0" y="0" width="136" height="26" rx="4" fill="#d0d4d9" stroke="#b2b8c0" stroke-width="1" />
              <text x="10" y="17" font-size="10" font-weight="600" fill="#22262c">Save as Custom Defaults</text>

              <rect x="144" y="0" width="140" height="26" rx="4" fill="#d0d4d9" stroke="#b2b8c0" stroke-width="1" />
              <text x="154" y="17" font-size="10" font-weight="600" fill="#22262c">Restore Category Defaults</text>

              <!-- Save / Close / Apply -->
              <rect x="424" y="0" width="50" height="26" rx="4" fill="#d0d4d9" stroke="#b2b8c0" stroke-width="1" />
              <text x="438" y="17" font-size="10" font-weight="600" fill="#22262c">Save</text>

              <rect x="480" y="0" width="50" height="26" rx="4" fill="#d0d4d9" stroke="#b2b8c0" stroke-width="1" />
              <text x="492" y="17" font-size="10" font-weight="600" fill="#22262c">Close</text>

              <rect x="536" y="0" width="56" height="26" rx="4" fill="#d0d4d9" stroke="#b2b8c0" stroke-width="1" />
              <text x="550" y="17" font-size="10" font-weight="600" fill="#22262c">Apply</text>
            </g>
          </g>
        </g>
      </g>
    </g>
    
</svg>